<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071827">
<title>Мой заработок — 40%</title>
<style>
:root{--bg:#071827;--card:#0d2233;--card2:#102a3e;--text:#eef7ff;--muted:#9fb5c7;--accent:#35d39b;--line:#234258;--danger:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#061522,#081d2c);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px}.title{font-size:28px;font-weight:800}.sub{color:var(--muted);margin-top:4px}
.card{background:rgba(13,34,51,.92);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px #0002;margin-bottom:14px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#081b2a;color:var(--text);font-size:16px}
button{border:0;border-radius:11px;padding:12px 16px;background:var(--accent);color:#042117;font-weight:800;cursor:pointer}.secondary{background:#18364b;color:var(--text)}.danger{background:#4a2029;color:#ffdfe3}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--card2);border-radius:14px;padding:14px}.stat b{display:block;font-size:22px;margin-top:5px}.stat span{color:var(--muted);font-size:12px}
.chartbox{overflow-x:auto}.chart{min-width:700px}.bars{display:flex;align-items:end;gap:8px;height:300px;padding:25px 8px 0;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}.barcol{height:100%;flex:1;min-width:26px;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px}.bar{width:100%;max-width:38px;background:linear-gradient(180deg,#4ae0ad,#20b985);border-radius:7px 7px 2px 2px;min-height:2px}.val{font-size:10px;color:#d9f8ed;white-space:nowrap;transform:rotate(-48deg);height:16px}.date{font-size:11px;color:var(--muted);margin-top:7px;white-space:nowrap}.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding:6px}
.progress{height:10px;background:#173247;border-radius:20px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);border-radius:20px}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #18374c;text-align:left;font-size:13px}th{color:var(--muted);font-weight:600}.right{text-align:right}.empty{text-align:center;color:var(--muted);padding:30px}
@media(max-width:700px){.wrap{padding:12px}.controls{grid-template-columns:1fr 1fr}.controls button{grid-column:span 2}.stats{grid-template-columns:1fr 1fr}.title{font-size:23px}.bars{height:250px}.card{padding:13px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><div class="title">Мой заработок 💰</div><div class="sub">Учёт выполненных работ и твоих 40%</div></div><button class="secondary" onclick="resetAll()">Сброс</button></div>

  <div class="card">
    <div class="controls">
      <div class="field"><label>Месяц</label><select id="month" onchange="render()"></select></div>
      <div class="field"><label>Дата</label><input id="date" type="date"></div>
      <div class="field"><label>Выполнено работ, ₽</label><input id="amount" type="number" min="0" step="100" placeholder="25000"></div>
      <button onclick="addEntry()">Добавить день</button>
    </div>
    <div style="margin-top:12px;color:var(--muted);font-size:13px">Процент: <b style="color:var(--text)">40%</b> · вводишь сумму работ → приложение само считает твой заработок.</div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <h3 style="margin:0 0 10px">Заработок по дням (40%)</h3>
    <div class="chartbox"><div class="chart"><div class="bars" id="bars"></div></div></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 12px">Цели на месяц</h3>
    <div id="goals"></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px">Дни</h3>
    <div style="overflow:auto"><table><thead><tr><th>Дата</th><th>Работы</th><th class="right">Твои 40%</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>
</div>
<script>
const KEY='my_earnings_v1';
const seed={
 '2026-08':{
  '2026-08-03':12500,'2026-08-04':19800,'2026-08-05':17600,'2026-08-06':40000,'2026-08-07':16400,
  '2026-08-10':22700,'2026-08-11':16100,'2026-08-12':24400,'2026-08-13':21500,'2026-08-14':20350,
  '2026-08-15':30800,'2026-08-16':27700,'2026-08-18':9800,'2026-08-19':18100,'2026-08-20':4500,
  '2026-08-21':34100,'2026-08-22':26500,'2026-08-23':13800,'2026-08-25':30400,'2026-08-26':32400,
  '2026-08-27':60500,'2026-08-28':26800,'2026-08-31':6100
 },
 '2026-09':{'2026-09-01':23900,'2026-09-02':16300,'2026-09-03':5600,'2026-09-05':15600,'2026-09-06':20500}
};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function money(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function ym(){return document.getElementById('month').value}
function entries(){return Object.entries(data[ym()]||{}).sort((a,b)=>a[0].localeCompare(b[0]))}
function renderMonths(){
 const s=document.getElementById('month'), old=s.value;
 const months=new Set([...Object.keys(data),'2026-08','2026-09']);
 const arr=[...months].sort().reverse();
 s.innerHTML=arr.map(m=>`<option value="${m}">${new Date(m+'-01').toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</option>`).join('');
 s.value=arr.includes(old)?old:arr[0];
}
function render(){
 renderMonths();
 const es=entries(), works=es.map(x=>x[1]), total=works.reduce((a,b)=>a+b,0), earn=total*.4, n=works.length;
 const avg=n?earn/n:0, best=n?Math.max(...works)*.4:0, med=n?[...works].sort((a,b)=>a-b)[Math.floor((n-1)/2)]*.4:0;
 const forecast=avg*22;
 document.getElementById('stats').innerHTML=[
  ['Заработано',money(earn)],['Выполнено работ',money(total)],['Рабочих дней',n],['Средний заработок',money(avg)],['Прогноз на 22 дня',money(forecast)],['Медиана/день',money(med)],['Лучший день',money(best)],['Средняя выработка',money(n?total/n:0)]
 ].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
 const max=Math.max(...works.map(x=>x*.4),1);
 document.getElementById('bars').innerHTML=es.length?es.map(([d,v])=>`<div class="barcol"><div class="val">${money(v*.4)}</div><div class="bar" style="height:${Math.max(2,v*.4/max*230)}px"></div><div class="date">${new Date(d+'T12:00').getDate()} ${new Date(d+'T12:00').toLocaleDateString('ru-RU',{month:'short'}).replace('.','')}</div></div>`).join(''):'<div class="empty">Добавь первый рабочий день</div>';
 const goals=[200000,225000,250000,275000,300000];
 document.getElementById('goals').innerHTML=goals.map(g=>{let p=Math.min(100,earn/g*100);return `<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><b>${money(g)}</b><span>${p.toFixed(0)}% · осталось ${money(Math.max(0,g-earn))}</span></div><div class="progress"><i style="width:${p}%"></i></div></div>`}).join('');
 document.getElementById('rows').innerHTML=es.map(([d,v])=>`<tr><td>${new Date(d+'T12:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}</td><td>${money(v)}</td><td class="right"><b>${money(v*.4)}</b></td><td class="right"><button class="danger" style="padding:7px 9px" onclick="delEntry('${d}')">×</button></td></tr>`).join('');
 const now=new Date(), defaultDate=ym()+'-'+String(Math.min(now.getDate(),28)).padStart(2,'0');
 document.getElementById('date').value=ym()==='2026-09'?'2026-09-07':(es.length?ym()+'-'+String(Number(es.at(-1)[0].slice(-2))+1).padStart(2,'0'):defaultDate);
}
function addEntry(){
 let d=document.getElementById('date').value, a=Number(document.getElementById('amount').value);
 if(!d||!a||a<0)return alert('Укажи дату и сумму работ.');
 let m=d.slice(0,7); if(!data[m])data[m]={}; data[m][d]=a; save(); document.getElementById('month').value=m; document.getElementById('amount').value=''; render();
}
function delEntry(d){if(confirm('Удалить этот день?')){delete data[ym()][d];save();render()}}
function resetAll(){if(confirm('Удалить все сохранённые данные и вернуть август/сентябрь из исходной статистики?')){data=seed;save();render()}}
renderMonths();document.getElementById('month').value='2026-09';render();
</script>
</body>
</html>
